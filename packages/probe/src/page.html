<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CKB light client probe</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --line: #d2d2d7; --accent: #1f9d6b; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #0b0b0c; --line: #2c2c2e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 32px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 20px 0 6px; }
  select, textarea { width: 100%; font: inherit; font-size: 14px; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 160px; resize: vertical; }
  button { margin-top: 20px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 980px; padding: 10px 22px; cursor: pointer; }
  .readout { display: none; gap: 48px; margin-top: 8px; }
  .figure { font-size: 64px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .caption { font-size: 13px; color: var(--muted); margin-top: 8px; }
  pre { white-space: pre-wrap; word-break: break-all; color: var(--muted); font-size: 12px; margin-top: 32px; }
  body[data-mode="running"] form, body[data-mode="driven"] form { display: none; }
  body[data-mode="running"] .readout, body[data-mode="driven"] .readout { display: flex; }
</style>
</head>
<body>
<main>
  <h1>Light client probe</h1>
  <p>Starts the official CKB light client in this tab with only the peers you list, and shows how many it reaches and how far it has synced.</p>
  <form onsubmit="return false">
    <label for="network">Network</label>
    <select id="network">
      <option value="mainnet">Mainnet</option>
      <option value="testnet">Testnet</option>
    </select>
    <label for="bootnodes">Peers, one per line (/dns4/…/tcp/443/wss/p2p/…)</label>
    <textarea id="bootnodes" spellcheck="false"></textarea>
    <button id="start" type="button">Start</button>
  </form>
  <section class="readout">
    <div><div class="figure" id="peers">0</div><div class="caption">peers</div></div>
    <div><div class="figure" id="tip">–</div><div class="caption">tip block</div></div>
    <div><div class="figure" id="status">0 s</div><div class="caption">since start</div></div>
  </section>
  <pre id="list"></pre>
</main>
<script type="module" src="./probe.js"></script>
</body>
</html>
